<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>中八自由练习</title>
  <style>
    :root{--gold:#d7b87b;--felt:#08724e;--ink:#f5eddd;--muted:#bbb09d}*{box-sizing:border-box}html,body{margin:0;min-width:320px;min-height:100%;background:radial-gradient(circle at 50% -30%,#4a4336,#191b1a 46%,#090b0b);color:var(--ink);font:15px system-ui,"Microsoft YaHei",sans-serif}body{height:100dvh;overflow:hidden}button,select{font:inherit}button{color:var(--ink);cursor:pointer}.practice-page{height:100dvh;min-height:360px;max-width:1600px;margin:auto;padding:clamp(8px,1.5vw,20px);display:grid;grid-template-columns:72px minmax(0,1fr) 72px;grid-template-rows:64px minmax(0,1fr);gap:clamp(8px,1.2vw,16px)}.toolbar{grid-column:1/-1;display:flex;align-items:center;gap:8px;min-width:0;padding:8px 12px;border:1px solid #655b4c;border-radius:15px;background:linear-gradient(#2b2e2c,#161918);box-shadow:0 10px 28px #0008}.tool{width:48px;min-width:48px;height:48px;display:grid;place-items:center;border:1px solid #736754;border-radius:11px;background:linear-gradient(145deg,#373936,#202321);color:var(--gold);font-size:22px}.tool[aria-pressed="true"]{color:#171a19;background:var(--gold)}.tool:disabled{opacity:.5;cursor:not-allowed}.title{padding:0 10px 0 4px;font-size:clamp(17px,2.3vw,27px);font-weight:800;letter-spacing:.08em;color:#f2d39a;white-space:nowrap}.divider{width:1px;height:32px;background:#8a806e}.tray{display:flex;align-items:center;gap:6px;min-width:0;flex:1;overflow:hidden}.tray-label{color:var(--muted);font-size:12px;white-space:nowrap}.ball-chip{width:31px;height:31px;flex:0 0 31px;display:grid;place-items:center;border-radius:50%;color:white;border:1px solid #ffffff6b;box-shadow:inset -3px -4px 7px #0005,0 2px 5px #0007;font-size:12px;font-weight:800}.ball-more{color:var(--gold);font-weight:800}.toolbar-spacer{flex:1}.side-control{min-height:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:9px 5px;border:1px solid #5c574b;border-radius:19px;background:linear-gradient(145deg,#333330,#1b1d1b);box-shadow:0 12px 24px #0005}.side-control h2{margin:0;color:var(--gold);font-size:11px;letter-spacing:.14em;writing-mode:vertical-rl}.control-value{color:#f5e4be;font-size:11px}.vertical-track{position:relative;width:50px;min-height:160px;flex:1;border-radius:25px;border:1px solid #86745b;background:linear-gradient(90deg,#171816,#4d493f 49%,#171816);touch-action:none;overflow:hidden}.vertical-track::before{content:"";position:absolute;inset:12px 20px;background:repeating-linear-gradient(to bottom,#c1a06a 0 2px,transparent 2px 18px);opacity:.56}.power-fill{position:absolute;left:8px;right:8px;bottom:8px;height:0;border-radius:17px;background:linear-gradient(to top,#d07337,#f4ce6e);box-shadow:0 0 12px #eaa84a94}.power-knob,.fine-thumb{position:absolute;left:5px;right:5px;height:38px;border-radius:18px;border:1px solid #f0d497;background:linear-gradient(#fff0c7,#b58e54);box-shadow:0 2px 7px #0009}.fine-window{position:absolute;inset:8px;border-radius:14px;background:linear-gradient(90deg,#171a18,#3e453f 48%,#171a18);overflow:hidden}.fine-ticks{position:absolute;inset:-100% 0;background:repeating-linear-gradient(to bottom,transparent 0 7px,#e1c689 7px 9px,transparent 9px 15px)}.fine-thumb{top:calc(50% - 19px);background:linear-gradient(#e7e5db,#8c928e);border-color:#e3dfc9}.table-shell{position:relative;min-width:0;min-height:0;display:grid;place-items:center;border:clamp(8px,1.1vw,14px) solid #5f3a25;border-radius:22px;background:linear-gradient(135deg,#9a6d47,#4d2e20 54%,#241510);box-shadow:inset 0 0 0 2px #c99b70,inset 0 0 36px #1b0e08,0 18px 45px #0009}.canvas-box{width:100%;max-height:100%;aspect-ratio:2/1;position:relative}canvas{display:block;width:100%;height:100%;border-radius:9px;background:var(--felt);touch-action:none}.table-tip{position:absolute;left:12px;bottom:10px;padding:6px 9px;border-radius:7px;color:#ecf4dd;background:#062d2499;font-size:11px}.parameters{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:8px}.parameter{width:50px;height:50px;display:grid;place-items:center;border:1px solid #d5bc86;border-radius:50%;background:radial-gradient(circle at 35% 28%,#575951,#202320 62%);color:var(--gold);box-shadow:0 3px 9px #0008;font-size:19px}.parameter small{position:absolute;margin-top:60px;color:#ece2ca;font-size:10px;text-shadow:0 1px 2px #000}.parameter:disabled{opacity:.5}.toast{position:fixed;left:50%;bottom:18px;z-index:30;transform:translate(-50%,130%);padding:9px 14px;border:1px solid #d3b271;border-radius:9px;color:#fff3d8;background:#211d18ed;box-shadow:0 6px 18px #0009;transition:transform .2s}.toast.show{transform:translate(-50%,0)}dialog{width:min(420px,calc(100vw - 32px));border:1px solid #8f7952;border-radius:16px;padding:0;color:var(--ink);background:linear-gradient(160deg,#30312c,#161816);box-shadow:0 24px 70px #000c}dialog::backdrop{background:#020504b8}.modal{padding:18px}.modal header{display:flex;align-items:center;justify-content:space-between}.modal h2{margin:0;color:#f1d49e;font-size:19px}.modal p{color:var(--muted);line-height:1.55}.tip-picker{width:min(192px,55vw);aspect-ratio:1;margin:18px auto;position:relative;border:2px solid #d0c2a1;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fffdf1,#d9d5c6 52%,#85867d 54%,#232522 57%);touch-action:none}.tip-picker::before,.tip-picker::after{content:"";position:absolute;background:#5f645d}.tip-picker::before{left:50%;top:8%;bottom:8%;width:1px}.tip-picker::after{top:50%;left:8%;right:8%;height:1px}.tip-dot{position:absolute;width:18px;height:18px;border:2px solid #ffe4b3;border-radius:50%;background:#cf5f47;transform:translate(-50%,-50%);box-shadow:0 0 12px #e9795c}.elevation{width:100%;accent-color:var(--gold)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.modal-actions button{min-height:44px;padding:0 14px;border:1px solid #81745e;border-radius:8px;background:#292b28}.modal-actions .primary{background:#927044;border-color:#ebcc8a;color:#fff9e9}.orientation{display:none;position:fixed;inset:0;z-index:50;place-items:center;text-align:center;background:#101211;color:var(--ink)}@media(max-width:760px){.practice-page{grid-template-columns:56px minmax(0,1fr) 56px;grid-template-rows:56px minmax(0,1fr);gap:6px;padding:6px}.toolbar{padding:4px 6px;gap:5px}.tool{width:48px;min-width:48px;height:48px}.title{font-size:16px;padding:0 3px}.divider,.tray-label{display:none}.ball-chip{width:25px;height:25px;flex-basis:25px;font-size:10px}.side-control{padding:5px 2px;gap:4px}.vertical-track{width:42px}.parameters{top:6px;right:6px;gap:5px}.parameter{width:44px;height:44px}.parameter small,.table-tip{display:none}}@media(max-height:359px){.orientation{display:grid}}
    .side-control.is-disabled { opacity:.5; filter:saturate(.35); }
    .table-shell { width:100%; aspect-ratio:2 / 1; align-self:center; }
    .drill-summary{min-width:0;max-width:260px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.drill-card{margin-top:16px;padding:14px;border:1px solid #75664d;border-radius:10px;background:#101512}.drill-card h3{margin:0 0 7px;color:#f2d39a;font-size:18px}.drill-card p{margin:7px 0}.difficulty{color:#f0cc75;letter-spacing:.12em}.drill-result{min-height:22px;color:#f1d49e;font-weight:700}.modal select{width:100%;min-height:44px;padding:8px;border:1px solid #81745e;border-radius:8px;background:#262924;color:var(--ink)}
  </style>
</head>
<body>
  <main class="practice-page" aria-label="中式八球自由练习">
    <header class="toolbar"><button id="back" class="tool" aria-label="返回练习首页" title="返回">‹</button><strong id="modeTitle" class="title">自由练习</strong><i class="divider"></i><div class="tray" aria-label="进球收集"><span class="tray-label">进球收集</span><div id="pocketTray" class="tray"></div></div><span id="drillSummary" class="drill-summary">选择球型练习开始训练</span><span class="toolbar-spacer"></span><button id="guideline" class="tool" aria-label="切换辅助线" title="辅助线" aria-pressed="true">⌁</button><button id="preset" class="tool" aria-label="选择练习球型" title="球型">▦</button><button id="shoot" class="tool" aria-label="按当前力度击球" title="击球">●</button><button id="retry" class="tool" aria-label="重打本杆" title="重打">↶</button><button id="nextDrillToolbar" class="tool" aria-label="下一题" title="下一题">›</button><button id="reset" class="tool" aria-label="重置球局" title="重置">↻</button><button id="settings" class="tool" aria-label="查看操作提示" title="说明">?</button></header>
    <section class="side-control" aria-label="瞄准微调"><h2>微调</h2><output id="aimValue" class="control-value">0°</output><div id="fineAim" class="vertical-track" tabindex="0" role="slider" aria-label="瞄准微调" aria-valuemin="-180" aria-valuemax="180"><span class="fine-window"><i id="fineTicks" class="fine-ticks"></i></span><i id="fineThumb" class="fine-thumb"></i></div></section>
    <section class="table-shell"><div class="canvas-box"><canvas id="table" width="1120" height="560" aria-label="中式八球练习球台：拖动空白处瞄准，自由练习可拖动球摆位"></canvas><div class="parameters"><button id="spinOpen" class="parameter" aria-label="设置母球击点" title="母球击点">⊙<small>加塞</small></button><button id="elevationOpen" class="parameter" aria-label="设置球杆角度" title="球杆角度">∠<small>杆角</small></button></div><span class="table-tip">拖动空白处瞄准；自由练习中可拖动球摆位</span></div></section>
    <section class="side-control" aria-label="击球力度"><h2>力度</h2><output id="powerValue" class="control-value">0%</output><div id="powerControl" class="vertical-track" tabindex="0" role="slider" aria-label="击球力度" aria-valuemin="0" aria-valuemax="100"><i id="powerFill" class="power-fill"></i><i id="powerKnob" class="power-knob"></i></div></section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="spinDialog"><section class="modal"><header><h2>母球击点</h2><button class="tool" data-close="spinDialog" aria-label="关闭">×</button></header><p>拖动红点设置侧塞与高低杆。</p><div id="tip" class="tip-picker" aria-label="击点选择器"><i id="tipDot" class="tip-dot"></i></div><div class="modal-actions"><button id="spinReset">居中</button><button class="primary" data-close="spinDialog">完成</button></div></section></dialog>
  <dialog id="elevationDialog"><section class="modal"><header><h2>球杆角度</h2><button class="tool" data-close="elevationDialog" aria-label="关闭">×</button></header><p>杆角会随本杆参数保存。当前二维 Tailuge MVP 不将它代入平面物理。</p><output id="elevationValue" class="control-value">0°</output><input id="elevation" class="elevation" type="range" min="0" max="90" value="0"><div class="modal-actions"><button id="elevationReset">恢复水平</button><button class="primary" data-close="elevationDialog">完成</button></div></section></dialog>
  <dialog id="presetDialog"><section class="modal"><header><h2>球型练习</h2><button class="tool" data-close="presetDialog" aria-label="关闭">×</button></header><p>自由球型可摆球；训练题使用题库的固定 ShotSeed 与同一 Tailuge 预测/实球链路。</p><select id="layout" aria-label="自由练习球型"></select><hr><label for="drillSelect">训练题</label><select id="drillSelect" aria-label="选择训练题"></select><article id="drillCard" class="drill-card" aria-live="polite"></article><div class="modal-actions"><button id="nextDrill">下一题</button><button id="loadDrill" class="primary">开始本题</button></div></section></dialog>
  <dialog id="helpDialog"><section class="modal"><header><h2>练习说明</h2><button class="tool" data-close="helpDialog" aria-label="关闭">×</button></header><p>辅助线和实球均由同一模拟器、同一出杆参数生成。击球后控件会锁定；停止后可重打或重置。</p><div class="modal-actions"><button class="primary" data-close="helpDialog">知道了</button></div></section></dialog>
  <div class="orientation">请旋转设备至横屏后继续练习</div><script type="module" src="/page.js"></script>
</body></html>
